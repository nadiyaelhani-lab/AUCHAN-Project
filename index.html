<!DOCTYPE html>

<html lang="fr">

<head>
  <meta charset="UTF-8">
     <title>AUCHAN'Co - Boutique</title>
  <script type="module" src="./js/main.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>   
<header>
<nav class="flex items-center justify-between p-4 bg-[#F5F8ED] text-[#183F35]"> 
   <h1 class="text-2xl font-bold tracking-tight">AUCHAN’Co</h1>

   <div class="hidden md:flex items-center gap-6 font-medium">
<a href="#accueil" class="text-[#183F35] font-semibold hover:text-[#FF805F] transition-colors">Accueil</a>
<a href="#produits" class="text-[#183F35] font-semibold hover:text-[#FF805F] transition-colors">Produits</a>
<a href="#contact" class="text-[#183F35] font-semibold hover:text-[#FF805F] transition-colors">Contact</a>
<a href="#panier" class="text-[#183F35] font-semibold hover:text-[#FF805F] transition-colors">Panier</a>
    </div>

    <button type="button" id="menu-mobile"
            class="block md:hidden"
            aria-controls="navigation-mobile"
            aria-expanded="false">
      ☰
    </button>
  </nav>

<div id="navigation-mobile" class="hidden md:hidden p-4 space-y-3 [&>a]:block">
      <a href="#accueil">Accueil</a>
    <a href="#produits">Produits</a>
    <a href="#contact">Contact</a>
    <a href="#panier">Panier</a>
  </div>
</header>

  <main>

    <h1>Bienvenue chez AUCHAN'Co.</h1>
<section id="produits" class="max-w-7xl mx-auto px-4 py-10">
  
<h2 class="text-3xl font-bold text-[#183F35] mb-6">Nos produits</h2>
  <div class="mb-6 space-y-4">

        <input
          type="search"
          id="recherche-produits"
          placeholder="Rechercher un produit..."
          aria-label="Rechercher un produit"
          class="w-full p-3 bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-[#183F35]"
        >

        <!-- Les catégories seront ajoutées par JavaScript -->
        <div
          id="filtres-categories"
          class="flex flex-wrap gap-3">
        </div>

      </div>
  <div class="flex gap-3 mb-6">
  <button type="button" id="vue-grille"
    class="bg-[#183F35] text-white px-4 py-2 rounded-lg">
    Grille
  </button>

  <button type="button" id="vue-liste"
    class="bg-[#F5F8ED] text-[#183F35] px-4 py-2 rounded-lg">
    Liste
  </button>
</div>
<div id="catalogue" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    
  </div>
  <div class="flex items-center justify-center gap-3 mt-6">
  <label for="taille-page">Produits par page :</label>

  <select id="taille-page" class="border rounded-lg p-2 bg-white">
    <option value="4">4</option>
    <option value="8" selected>8</option>
    <option value="12">12</option>
  </select>
</div>
<div id="pagination" class="flex justify-center items-center gap-3 mt-8">
</div>
</section>
<section id="panier" class="max-w-7xl mx-auto px-4 py-10">
    <h2 class="text-3xl font-bold text-[#183F35] mb-6">
        Mon panier
    </h2>
    <div
  id="zone-panier"
  class="border-2 border-dashed border-[#183F35] rounded-xl p-8 text-center bg-white">

  <p class="text-gray-600">
    Glissez un produit ici pour l'ajouter au panier.
  </p>

</div>
</section>
  </main>
  <footer>
<div class="bg-[#F5F8ED] text-[#183F35] p-6">
  <h2 class="text-xl font-bold">AUCHAN’Co</h2>
  <p>Vos courses, avec le sourire.</p>
  <div class="flex flex-wrap gap-4 mt-4">
  <a href="#accueil">Accueil</a>
  <a href="#produits">Produits</a>
  <a href="#contact">Contact</a>
</div>
  <p class="mt-4 text-sm">© 2026 AUCHAN’Co</p>
</div>
  </footer>
</body>

</html>
